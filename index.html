<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior Astronaut: Docking Challenge</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--ac:#2f6bff;--bd:#d9dfef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#eef1fb;--mut:#9aa6c9;--ac:#6c9bff;--bd:#2a3459;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--tx:#eef1fb;--mut:#9aa6c9;--ac:#6c9bff;--bd:#2a3459;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:1.5rem;margin:0 0 2px;color:var(--ac);background:linear-gradient(90deg,#2f6bff,#43c9c9,#a46bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mut);margin:0 0 10px;font-size:.92rem}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.hud b{color:var(--tx)}.hud span{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px 11px}
canvas{-webkit-tap-highlight-color:transparent;width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--bd);background:#050814;box-shadow:0 8px 30px rgba(47,107,255,.25);touch-action:none}
.layout{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-areas:"btns" "hud" "canvas" "msg" "pad"}.btns{grid-area:btns;display:flex;gap:8px}.btns .go{margin:0;padding:8px 14px}.go.alt{background:transparent;color:var(--ac);border:2px solid var(--ac);padding:6px 12px}.layout>.hud{grid-area:hud;margin:0}.layout>canvas{grid-area:canvas}.layout>.msg{grid-area:msg}.layout>.pad{grid-area:pad;margin:0}
@media(min-width:820px){main{max-width:960px}.layout{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"hud btns" "canvas msg" "canvas pad" "canvas .";grid-template-rows:auto auto auto 1fr;column-gap:16px}.btns{justify-content:flex-end}.layout>.pad{justify-self:center}}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin:12px 0}
.pad button{font:inherit;font-size:1.4rem;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.pad button:active{border-color:var(--ac)}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
.tip{margin-top:8px;text-align:left;font-size:.88rem;color:var(--mut);border-left:3px solid var(--ac);padding:4px 10px}.msg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;text-align:center;min-height:64px}
.go{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 18px;margin-top:8px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🛰️ Docking Challenge</h1>
<p class="sub">Fly your capsule into the station’s port. Go slow: a fast touch means a crash! Press P to pause.</p>
<div class="layout">
<div class="btns"><button class="go" id="demoBtn">🎬 Watch demo</button><button class="go alt" id="pauseBtn">⏸ Pause</button></div>
<div class="hud"><span>Level <b id="lv">1</b>/6</span><span>Fuel <b id="fu">100</b>%</span><span>Speed <b id="sp">0.0</b></span><span>Score <b id="sc">0</b></span><span>🏆 Best <b id="hs">0</b></span></div>
<canvas id="c" width="520" height="340"></canvas>
<div class="msg" id="msg"></div>
<div class="pad">
<button class="u" data-k="up" aria-label="Thrust up">▲</button>
<button class="l" data-k="left" aria-label="Thrust left">◀</button>
<button class="d" data-k="down" aria-label="Thrust down">▼</button>
<button class="r" data-k="right" aria-label="Thrust right">▶</button>
</div>
</div>
</main>
<script>
(function(){
"use strict";
var raf=window.requestAnimationFrame||window.webkitRequestAnimationFrame||window.mozRequestAnimationFrame||function(f){return setTimeout(function(){f(Date.now())},16)};
var cv=document.getElementById("c"),g=cv.getContext("2d"),W=520,H=340;
var dpr=Math.min(window.devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
var paused=false,best=0,demo=false,phase=-1,trail=[],parts=[],keys={},final=false,lvl=1,score=0,state="ready",ship,port,debris=[],fuel=100,stars=[],last=0,clock=0;
for(var n=0;n<60;n++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.6+.4]);
var LV=[
{name:"First Approach",drift:0,deb:0,fuel:100,tol:0.7,tip:"Thrusters push the opposite way. To slow down, fire against your direction of travel (Newton’s third law)."},
{name:"Moving Target",drift:0.35,deb:0,fuel:90,tol:0.6,tip:"The station moves too. Pilots match its motion first, then close in slowly."},
{name:"Junk Field",drift:0.45,deb:3,fuel:85,tol:0.5,tip:"Short taps use less fuel than long burns. Plan your path before you thrust."},
{name:"Fast Lane",drift:0.6,deb:3,fuel:80,tol:0.45,tip:"Do not chase the port. Line up with where it will be, then drift in."},
{name:"Debris Storm",drift:0.5,deb:5,fuel:80,tol:0.4,tip:"Watch the glow ring: green means your speed is safe to dock, orange means brake."},
{name:"Final Docking",drift:0.7,deb:5,fuel:70,tol:0.35,tip:"Real crews practice this for years. Stay calm, use small burns and stop drifting before you touch."}
];
var FACTS=["The ISS orbits about 400 km above Earth and is about as long as a football field.","Astronauts on the ISS see around 16 sunrises and sunsets every day.","Thousands of pieces of space junk orbit Earth, and some travel faster than a bullet.","In microgravity there is no up or down, so astronauts sleep in sleeping bags fixed to the wall.","When docking, spacecraft close in at only a few centimeters per second at the end.","The ISS travels about 28,000 km/h and circles Earth roughly every 90 minutes."];
function tipbox(t){return '<div class="tip">💡 '+t+'</div>'}
function rank(){return score>=950?"Mission Commander":score>=750?"Flight Engineer":"Rookie Astronaut"}
function $(id){return document.getElementById(id)}
try{best=parseInt(localStorage.getItem("dockBest"),10)||0}catch(e){}
function saveBest(){try{localStorage.setItem("dockBest",String(best))}catch(e){}}
function setPaused(v){paused=v;keys={};last=0;$("pauseBtn").textContent=v?"▶ Resume":"⏸ Pause"}
function togglePause(){if(state==="play")setPaused(!paused)}
function dist(a,b,c,d){var x=a-c,y=b-d;return Math.sqrt(x*x+y*y)}
function msg(h,btn){$("msg").innerHTML=h+(btn?'<br><button class="go" id="gb">'+btn+'</button>':"");var b=$("gb");if(b)b.onclick=start}
function setup(){
 var L=LV[lvl-1];fuel=L.fuel;keys={};trail=[];parts=[];
 ship={x:60,y:H-60,vx:0,vy:0};
 port={x:W-70,y:70+Math.random()*(H-190),vy:L.drift*(Math.random()<.5?-1:1)};
 debris=[];for(var k=0;k<L.deb;k++)debris.push({x:130+k*(280/L.deb),y:40+Math.random()*(H-80),vy:(Math.random()*1.2+.6)*(k%2?1:-1),r:11});
}
function start(){
 if(paused)setPaused(false);
 if(final){lvl=1;score=0;final=false}
 setup();state="play";last=0;
 var L=LV[lvl-1];msg("<b>Stage "+lvl+": "+L.name+"</b><br>Keep speed under <b>"+L.tol.toFixed(1)+"</b> when you touch the port."+tipbox(L.tip));
}
function autopilot(){
 var dx=port.x-ship.x,dy=port.y-ship.y,d=dist(dx,dy,0,0)||1,cap=Math.min(0.6,0.12+d*0.004);
 var ex=dx/d*cap-ship.vx,ey=dy/d*cap+port.vy-ship.vy;
 keys={};if(ex>0.012)keys.right=true;else if(ex<-0.012)keys.left=true;if(ey>0.012)keys.down=true;else if(ey<-0.012)keys.up=true;
 var ph=d>170?0:d>60?1:2;
 if(ph!==phase){phase=ph;msg(["<b>🎬 Demo:</b> Short thruster bursts speed the capsule up toward the station.","<b>🎬 Demo:</b> Now it brakes. Firing against the motion slows the capsule down.","<b>🎬 Demo:</b> Creeping in. Speed must stay under 0.7 to dock safely."][ph])}
}
function startDemo(){if(paused)setPaused(false);lvl=1;score=0;final=false;demo=true;phase=-1;setup();state="play";last=0}
function dir(e){
 var k=e.key,c=e.keyCode;
 if(k==="ArrowUp"||k==="Up"||k==="w"||k==="W"||c===38||c===87)return"up";
 if(k==="ArrowDown"||k==="Down"||k==="s"||k==="S"||c===40||c===83)return"down";
 if(k==="ArrowLeft"||k==="Left"||k==="a"||k==="A"||c===37||c===65)return"left";
 if(k==="ArrowRight"||k==="Right"||k==="d"||k==="D"||c===39||c===68)return"right";
 return null;
}
document.addEventListener("keydown",function(e){if(e.key==="p"||e.key==="P"||e.keyCode===80){togglePause();return}var m=dir(e);if(m){keys[m]=true;if(e.preventDefault)e.preventDefault()}},false);
document.addEventListener("keyup",function(e){var m=dir(e);if(m)keys[m]=false},false);
window.addEventListener("blur",function(){keys={}},false);
var btns=document.querySelectorAll(".pad button");
Array.prototype.forEach.call(btns,function(b){
 var k=b.getAttribute("data-k");
 function on(e){if(e.preventDefault)e.preventDefault();keys[k]=true}
 function off(){keys[k]=false}
 b.addEventListener("touchstart",on,{passive:false});
 b.addEventListener("touchend",off,false);b.addEventListener("touchcancel",off,false);
 b.addEventListener("mousedown",on,false);b.addEventListener("mouseup",off,false);b.addEventListener("mouseleave",off,false);
 b.addEventListener("contextmenu",function(e){e.preventDefault()},false);
});
function burst(x,y,cols,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=Math.random()*2.6+.4;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:40,c:cols[i%cols.length]})}}
function end(s,h,b){state=s;demo=false;keys={};if(paused)setPaused(false);msg(h,b);if(s==="crash")burst(ship.x,ship.y,["#ff8a33","#ffe27a","#ff5a4d"],45);else if(s==="won")burst(port.x,port.y,["#43c985","#9affc4","#ffffff"],45)}
function step(now){
 now=now||Date.now();
 var dt=last?(now-last)/16.667:1;last=now;
 if(dt>3)dt=3;if(dt<0)dt=0;
 clock+=dt;
 for(var q=parts.length-1;q>=0;q--){var p=parts[q];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(q,1)}
 if(state==="play"&&!paused){
  if(demo)autopilot();
  var a=0.006*dt,used=0;
  if(fuel>0){
   if(keys.up){ship.vy-=a;used++}if(keys.down){ship.vy+=a;used++}
   if(keys.left){ship.vx-=a;used++}if(keys.right){ship.vx+=a;used++}
   fuel=Math.max(0,fuel-used*0.06*dt);
  }
  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;trail.push([ship.x,ship.y]);if(trail.length>50)trail.shift();
  port.y+=port.vy*dt;if(port.y<50||port.y>H-50)port.vy*=-1;
  for(var i=0;i<debris.length&&state==="play";i++){var d=debris[i];
   d.y+=d.vy*dt;if(d.y<20||d.y>H-20)d.vy*=-1;
   if(dist(ship.x,ship.y,d.x,d.y)<d.r+9)end("crash","💥 You hit space junk!"+tipbox(LV[lvl-1].tip),"Try again")}
  var sp=dist(ship.vx,ship.vy,0,0),tol=LV[lvl-1].tol;
  if(state==="play"){
   if(dist(ship.x,ship.y,port.x,port.y)<14){
    if(sp<=tol&&demo){end("won","🎬 <b>Demo complete!</b> Slow, steady and gentle: that is how real docking works. Now you try!"+tipbox(FACTS[4]),"Play for real")}
    else if(sp<=tol){var bonus=Math.round(100+fuel);score+=bonus;var nb=score>best;if(nb){best=score;saveBest()}
     var fin=lvl>=LV.length,fact=FACTS[(lvl-1)%FACTS.length];
     end("won",fin?"🏅 <b>"+rank()+"!</b> You docked in all "+LV.length+" stages. Final score: "+score+(nb?" 🏆 New best!":"")+tipbox(fact):"✅ <b>Stage "+lvl+" docked!</b> +"+bonus+" points."+(nb?" 🏆 New best!":"")+tipbox(fact),fin?"Play again":"Next stage");
     if(lvl<LV.length)lvl++;else final=true;
    }else end("crash","💥 Too fast! Real spacecraft dock at just a few centimeters per second."+tipbox(LV[lvl-1].tip),"Try again");
   }else if(ship.x<8||ship.x>W-8||ship.y<8||ship.y>H-8)end("crash","🌌 You drifted away!"+tipbox(LV[lvl-1].tip),"Try again");
  }
  $("sp").textContent=sp.toFixed(1);
 }
 $("lv").textContent=lvl;$("fu").textContent=Math.round(fuel);$("sc").textContent=score;$("hs").textContent=best;
 draw();raf(step);
}
function flame(x,y,ax,ay){var l=9+Math.random()*7,px=-ay,py=ax;
 g.fillStyle="#ff8a33";g.beginPath();g.moveTo(x+px*4,y+py*4);g.lineTo(x+ax*l,y+ay*l);g.lineTo(x-px*4,y-py*4);g.fill();
 g.fillStyle="#ffe27a";g.beginPath();g.moveTo(x+px*2,y+py*2);g.lineTo(x+ax*l*.6,y+ay*l*.6);g.lineTo(x-px*2,y-py*2);g.fill()}
function glow(x,y,r,c){var q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c);q.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function draw(){
 var i,bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#02030a");bg.addColorStop(1,"#0d1a45");
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 glow(180,70,170,"rgba(120,70,220,.22)");glow(380,250,150,"rgba(40,130,220,.18)");
 g.fillStyle="#fff";for(i=0;i<stars.length;i++){var st=stars[i];g.globalAlpha=.35+.45*Math.sin(clock/30+st[0]);g.fillRect(st[0],st[1],st[2],st[2])}g.globalAlpha=1;
 var ex=140,ey=H+250,er=330,eg=g.createRadialGradient(ex-60,ey-200,40,ex,ey,er);
 eg.addColorStop(0,"#2a78d6");eg.addColorStop(.8,"#124a99");eg.addColorStop(1,"#0a2a5c");
 glow(ex,ey,er+34,"rgba(0,0,0,0)");
 g.strokeStyle="rgba(130,200,255,.35)";g.lineWidth=7;g.beginPath();g.arc(ex,ey,er+3,0,7);g.stroke();
 g.fillStyle=eg;g.beginPath();g.arc(ex,ey,er,0,7);g.fill();
 g.save();g.beginPath();g.arc(ex,ey,er,0,7);g.clip();g.fillStyle="rgba(70,170,100,.7)";
 g.beginPath();g.ellipse?g.ellipse(50,H-24,50,14,-.2,0,7):g.arc(50,H-24,30,0,7);g.fill();
 g.beginPath();g.ellipse?g.ellipse(250,H-20,60,10,.15,0,7):g.arc(250,H-20,30,0,7);g.fill();
 g.fillStyle="rgba(255,255,255,.35)";g.fillRect(90,H-62,70,5);g.fillRect(180,H-50,60,4);g.restore();
 if(!ship){return}
 var sx=W-56,pul=.5+.5*Math.sin(clock/12);
 var sg=g.createLinearGradient(sx,0,W,0);sg.addColorStop(0,"#5b678f");sg.addColorStop(.5,"#b5bedb");sg.addColorStop(1,"#7d88ad");
 g.fillStyle="#1d56c9";g.fillRect(W-50,0,44,18);g.fillRect(W-50,H-18,44,18);
 g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=1;for(i=0;i<5;i++){g.beginPath();g.moveTo(W-50+i*11,0);g.lineTo(W-50+i*11,18);g.moveTo(W-50+i*11,H-18);g.lineTo(W-50+i*11,H);g.stroke()}
 g.fillStyle=sg;g.fillRect(sx,18,56,H-36);
 g.fillStyle="rgba(0,0,0,.25)";for(i=0;i<7;i++)g.fillRect(sx,18+i*((H-36)/7),56,2);
 g.fillStyle="#e8ecfa";g.fillRect(W-14,18,4,H-36);
 glow(port.x,port.y,26+pul*8,"rgba(67,201,133,"+(.35+pul*.3)+")");
 g.fillStyle="#43c985";g.beginPath();g.arc(port.x,port.y,13,0,7);g.fill();
 g.fillStyle="#050814";g.beginPath();g.arc(port.x,port.y,7,0,7);g.fill();
 g.strokeStyle="#c8ffe0";g.lineWidth=2;g.beginPath();g.arc(port.x,port.y,13+pul*3,0,7);g.stroke();
 for(i=0;i<debris.length;i++){var d=debris[i],dg=g.createRadialGradient(d.x-4,d.y-4,2,d.x,d.y,d.r);dg.addColorStop(0,"#c19a7a");dg.addColorStop(1,"#5e4331");
  g.fillStyle=dg;g.beginPath();g.arc(d.x,d.y,d.r,0,7);g.fill();g.fillStyle="rgba(0,0,0,.3)";g.beginPath();g.arc(d.x+3,d.y+2,3,0,7);g.fill();g.beginPath();g.arc(d.x-4,d.y+4,2,0,7);g.fill()}
 for(i=0;i<trail.length;i+=2){g.fillStyle="rgba(150,190,255,"+(i/trail.length*.45)+")";g.beginPath();g.arc(trail[i][0],trail[i][1],2,0,7);g.fill()}
 if(state!=="crash"){
  var x=ship.x,y=ship.y,sp=dist(ship.vx,ship.vy,0,0),good=sp<=LV[lvl-1].tol;
  if(state==="play"){glow(x,y,26,good?"rgba(67,201,133,.28)":"rgba(255,110,80,.28)");
   g.strokeStyle=good?"#43c985":"#ff7a59";g.lineWidth=2;g.beginPath();g.arc(x,y,17,0,7);g.stroke()}
  if(state==="play"&&fuel>0){if(keys.left)flame(x+11,y,1,0);if(keys.right)flame(x-12,y,-1,0);if(keys.up)flame(x,y+8,0,1);if(keys.down)flame(x,y-8,0,-1)}
  var cg=g.createLinearGradient(x,y-8,x,y+8);cg.addColorStop(0,"#ffffff");cg.addColorStop(1,"#9aa6c9");
  g.fillStyle="#6b7699";g.fillRect(x-13,y-3,4,6);
  g.fillStyle=cg;g.beginPath();g.moveTo(x-10,y-7);g.lineTo(x+5,y-8);g.lineTo(x+13,y);g.lineTo(x+5,y+8);g.lineTo(x-10,y+7);g.closePath();g.fill();
  g.fillStyle="#2f6bff";g.beginPath();g.arc(x+4,y,3.5,0,7);g.fill();g.fillStyle="rgba(255,255,255,.7)";g.fillRect(x+3,y-2,2,1.5);
 }
 for(i=0;i<parts.length;i++){var p=parts[i];g.globalAlpha=Math.max(0,p.l/40);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.2,0,7);g.fill()}g.globalAlpha=1;
 if(paused){g.fillStyle="rgba(5,8,20,.6)";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.textAlign="center";g.font="bold 28px system-ui,sans-serif";g.fillText("⏸ PAUSED",W/2,H/2);g.font="14px system-ui,sans-serif";g.fillText("Press P or Resume to continue",W/2,H/2+28);g.textAlign="left"}
}
$("demoBtn").onclick=function(){this.blur();startDemo()};
$("pauseBtn").onclick=function(){this.blur();togglePause()};
window.onerror=function(m){msg("⚠️ Something went wrong: "+m+". Please reload the page.")};
setup();msg("<b>Mission:</b> dock with the green port without crashing.","Start mission");raf(step);
})();
</script>
</body>
</html>
